# Ledger-backed override for the Aries lab (plan Feature B).
#
# The base docker-compose.yml runs ACA-Py with --no-ledger (connections/DIDComm
# only). This override enables AnonCreds by pointing the issuer + verifier at the
# local VON/Indy genesis and adding a tails server for revocation.
#
# Run (VON comes from the base file's "ledger" profile):
#   cd aries-lab
#   docker compose --profile ledger -f docker-compose.yml -f docker-compose.ledger.yml up -d
#
# Then register the issuer DID once (self-serve on VON):
#   open http://localhost:9000  → "Register from seed" using ISSUER_LEDGER_SEED
#
# This file is NOT used by production and is not deployed to Azure.

name: cloudstrucc-aegis-id-aries

services:
  acapy-issuer:
    command: >
      start
      --label "Cloudstrucc Aries Issuer"
      --inbound-transport http 0.0.0.0 4010
      --outbound-transport http
      --admin 0.0.0.0 4011
      --admin-insecure-mode
      --endpoint ${ISSUER_ENDPOINT:-http://localhost:4010}
      --genesis-url http://von-network:9000/genesis
      --wallet-type askar-anoncreds
      --wallet-name issuer-wallet
      --wallet-key ${ISSUER_WALLET_KEY:-change-me-issuer}
      --seed ${ISSUER_LEDGER_SEED:-000000000000000000000000Issuer01}
      --tails-server-base-url ${TAILS_SERVER_BASE_URL:-http://tails:6543}
      --auto-provision
      --auto-accept-invites
      --auto-accept-requests
      --auto-ping-connection
    depends_on:
      - tails

  acapy-verifier:
    command: >
      start
      --label "Cloudstrucc Aries Verifier"
      --inbound-transport http 0.0.0.0 5010
      --outbound-transport http
      --admin 0.0.0.0 5011
      --admin-insecure-mode
      --endpoint ${VERIFIER_ENDPOINT:-http://localhost:5010}
      --genesis-url http://von-network:9000/genesis
      --wallet-type askar-anoncreds
      --wallet-name verifier-wallet
      --wallet-key ${VERIFIER_WALLET_KEY:-change-me-verifier}
      --auto-provision
      --auto-accept-invites
      --auto-accept-requests
      --auto-ping-connection

  tails:
    image: ghcr.io/bcgov/tails-server:latest
    command: >
      tails-server
      --host 0.0.0.0
      --port 6543
      --storage-path /tails-files
      --log-level INFO
    ports:
      - "6543:6543"
